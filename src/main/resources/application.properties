#Liquibase 
spring.liquibase.change-log=classpath:db/liquibase-changelog.xml
spring.liquibase.enabled=true

#H2 DB 
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#SOAP
soap.endpoint.host=localhost
soap.endpoint.port=8888
soap.endpoint.name=baws
# The endpoint is served over HTTPS only; startup fails without a key store.
soap.endpoint.ssl.key-store=${SOAP_SSL_KEY_STORE:}
soap.endpoint.ssl.key-store-password=${SOAP_SSL_KEY_STORE_PASSWORD:}
soap.endpoint.ssl.key-store-type=${SOAP_SSL_KEY_STORE_TYPE:PKCS12}
