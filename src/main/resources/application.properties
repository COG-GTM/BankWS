#Liquibase 
spring.liquibase.change-log=classpath:db/liquibase-changelog.xml
spring.liquibase.enabled=true

#H2 DB 
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#SOAP
soap.endpoint.host=localhost
soap.endpoint.port=8888
soap.endpoint.name=baws

# SOAP callers (HTTP Basic). With no users configured every request is rejected.
# Generate a hash with: java -cp target/classes com.github.rshtishi.bankws.security.PasswordHashes
# Supply real values via environment variables, e.g. SOAP_SECURITY_USERS_PARTNERA_PASSWORDHASH.
#soap.security.users.partnera.password-hash=pbkdf2-sha256$310000$<salt>$<hash>
#soap.security.users.partnera.clients=kbalaj
#soap.security.users.bankadmin.password-hash=pbkdf2-sha256$310000$<salt>$<hash>
#soap.security.users.bankadmin.admin=true

# Required before binding soap.endpoint.host to a non-loopback address.
#soap.endpoint.ssl.key-store=/path/to/keystore.p12
#soap.endpoint.ssl.key-store-password=${SOAP_KEYSTORE_PASSWORD}
